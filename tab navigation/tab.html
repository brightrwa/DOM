<!DOCTYPE html>
<html>
<head>
    <title>Tab Navigation</title>
</head>
<body>

    <h1>My Website</h1>

    <div id="tabs">

        <button class="tab active" data-tab="home">
            Home
        </button>

        <button class="tab" data-tab="about">
            About
        </button>

        <button class="tab" data-tab="contact">
            Contact
        </button>

    </div>

    <div id="content">

        <div class="panel active" id="home">
            <h2>Home</h2>
            <p>Welcome to my website!</p>
        </div>

        <div class="panel" id="about">
            <h2>About</h2>
            <p>This website is about learning JavaScript.</p>
        </div>

        <div class="panel" id="contact">
            <h2>Contact</h2>
            <p>Contact us here.</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
